name: Court IQ Android

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: courtiq-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android verification
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-36.1
            build-tools;36.0.0

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Assert clean checkout without Firebase credentials
        run: |
          set -euo pipefail
          test ! -e debug.keystore
          test ! -e app/debug.keystore
          test ! -e .env
          test -z "$(find app -name google-services.json -print -quit)"

      - name: Verify automatic debug keystore generation
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --no-configuration-cache \
            --no-build-cache --stacktrace :app:validateSigningDebug
          test -s debug.keystore
          test ! -e app/debug.keystore
          keytool -list -keystore debug.keystore \
            -storepass android -alias androiddebugkey

      - name: Verify existing debug keystore is reused
        run: |
          set -euo pipefail
          before="$(sha256sum debug.keystore)"
          ./gradlew --no-daemon --no-configuration-cache \
            --no-build-cache --stacktrace :app:validateSigningDebug
          test "$before" = "$(sha256sum debug.keystore)"

      - name: Android unit tests
        if: ${{ !cancelled() }}
        run: |
          ./gradlew --no-daemon --no-configuration-cache \
            --no-build-cache --stacktrace :app:testDebugUnitTest

      - name: Android lint
        if: ${{ !cancelled() }}
        run: |
          ./gradlew --no-daemon --no-configuration-cache \
            --no-build-cache --stacktrace :app:lintDebug

      - name: Assemble debug APK
        id: apk
        if: ${{ !cancelled() }}
        run: |
          ./gradlew --no-daemon --no-configuration-cache \
            --no-build-cache --stacktrace :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Publish debug APK
        if: ${{ !cancelled() && steps.apk.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: court-iq-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish test and lint reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: court-iq-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 14
